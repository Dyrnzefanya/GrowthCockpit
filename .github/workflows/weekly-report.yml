name: Weekly report draft (opt-in fallback)
on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-report-scheduler
  cancel-in-progress: false
jobs:
  trigger:
    if: vars.PMOS_SCHEDULER == 'github' && vars.PMOS_REPORTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the previous WIB week's draft
        env:
          PMOS_ORIGIN: ${{ vars.PMOS_ORIGIN }}
          CRON_SECRET: ${{ secrets.PMOS_CRON_SECRET }}
          PROTECTION_BYPASS: ${{ secrets.PMOS_PROTECTION_BYPASS }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.PMOS_ORIGIN);
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.pathname !== '/' || origin.search || origin.hash) throw new Error('Invalid PMOS_ORIGIN');
          if (!process.env.CRON_SECRET) throw new Error('Missing PMOS_CRON_SECRET');
          const headers = { Authorization: `Bearer ${process.env.CRON_SECRET}` };
          if (process.env.PROTECTION_BYPASS) headers['x-vercel-protection-bypass'] = process.env.PROTECTION_BYPASS;
          const response = await fetch(new URL('/api/jobs/JOB-WEEKLY-REPORT', origin), { method: 'POST', headers, redirect: 'error', signal: AbortSignal.timeout(15000) });
          if (response.status === 409) process.exit(0);
          if (!response.ok) throw new Error(`Job endpoint HTTP ${response.status}`);
          const result = await response.json();
          if (result.status !== 'success') throw new Error('Report generation failed; inspect integration runs');
          NODE
