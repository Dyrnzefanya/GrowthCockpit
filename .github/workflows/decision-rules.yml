name: Daily decision evaluation (opt-in fallback)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decision-rule-scheduler
  cancel-in-progress: false
jobs:
  trigger:
    if: vars.PMOS_SCHEDULER == 'github' && vars.PMOS_DECISIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke existing job endpoint at 07:00 WIB
        env:
          PMOS_ORIGIN: ${{ vars.PMOS_ORIGIN }}
          CRON_SECRET: ${{ secrets.PMOS_CRON_SECRET }}
          PROTECTION_BYPASS: ${{ secrets.PMOS_PROTECTION_BYPASS }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.PMOS_ORIGIN);
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.pathname !== '/' || origin.search || origin.hash) throw new Error('Invalid PMOS_ORIGIN');
          if (!process.env.CRON_SECRET) throw new Error('Missing PMOS_CRON_SECRET');
          const headers = { Authorization: `Bearer ${process.env.CRON_SECRET}` };
          if (process.env.PROTECTION_BYPASS) headers['x-vercel-protection-bypass'] = process.env.PROTECTION_BYPASS;
          const started = Date.now();
          do {
            if (Date.now() - started >= 30000) throw new Error('Daily evaluation exceeded 30s; inspect and resume pending batches');
            const response = await fetch(new URL('/api/jobs/JOB-EVALUATE-RULES', origin), {method:'POST', headers, redirect:'error', signal:AbortSignal.timeout(30000)});
            if (response.status === 409) { console.log('Job already running'); process.exit(0); }
            if (!response.ok) throw new Error(`Job endpoint HTTP ${response.status}`);
            const result = await response.json();
            if (!['success','partial'].includes(result.status)) throw new Error('Evaluation failed; inspect integration runs');
            if (!result.hasMore) break;
          } while (true);
          if (Date.now()-started>30000) throw new Error('Daily evaluation exceeded 30s');
          console.log('Daily evaluation completed within 30 seconds');
          NODE
