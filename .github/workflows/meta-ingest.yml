name: Meta daily ingest scheduler (opt-in fallback)
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meta-ingest-scheduler
  cancel-in-progress: false
jobs:
  trigger:
    if: vars.PMOS_SCHEDULER == 'github' && vars.PMOS_META_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Invoke existing job endpoint
        env:
          PMOS_ORIGIN: ${{ vars.PMOS_ORIGIN }}
          CRON_SECRET: ${{ secrets.PMOS_CRON_SECRET }}
          PROTECTION_BYPASS: ${{ secrets.PMOS_PROTECTION_BYPASS }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.PMOS_ORIGIN);
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.pathname !== '/' || origin.search || origin.hash) throw new Error('Invalid PMOS_ORIGIN');
          if (!process.env.CRON_SECRET) throw new Error('Missing PMOS_CRON_SECRET');
          const headers = { Authorization: `Bearer ${process.env.CRON_SECRET}` };
          if (process.env.PROTECTION_BYPASS) headers['x-vercel-protection-bypass'] = process.env.PROTECTION_BYPASS;
          const deadline = Date.now() + 50 * 60000;
          for (;;) {
          if (Date.now() >= deadline) throw new Error("Backfill remains pending; continue the same job");
          const response = await fetch(new URL('/api/jobs/JOB-META-INGEST', origin), { method: 'POST', headers, redirect: 'error', signal: AbortSignal.timeout(65000) });
          if (response.status === 409) { console.log('Job already running'); process.exit(0); }
          if (!response.ok) throw new Error(`Job endpoint HTTP ${response.status}`);
          const result = await response.json();
          if (!['success', 'partial'].includes(result.status)) throw new Error('Job failed; inspect integration runs');
          if (!result.hasMore) break;
          }
          console.log('Job invocation completed');
          NODE
